version: "3.9"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dataflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
      POSTGRES_DB: ${POSTGRES_DB:-dataflow}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - dataflow_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dataflow}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-dataflow}:${POSTGRES_PASSWORD:-change_me}@db:5432/${POSTGRES_DB:-dataflow}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy

  pipeline:
    build:
      context: .
      dockerfile: docker/Dockerfile.pipeline
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-dataflow}:${POSTGRES_PASSWORD:-change_me}@db:5432/${POSTGRES_DB:-dataflow}
    volumes:
      - ./data:/app/data
    depends_on:
      db:
        condition: service_healthy
    # Not started automatically (`restart: "no"`) -- run on demand with:
    #   docker compose run pipeline --start 2024-09-01 --end 2025-08-31
    restart: "no"

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  dataflow_pg_data:
